name: CI

# 앱 동작에 영향을 주는 변경만 자동 검증하고, 필요할 때는 수동 실행도 허용한다.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Package.resolved"
      - "Resources/**"
      - "Sources/**"
      - "Tests/**"
      - "Vendor/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Package.resolved"
      - "Resources/**"
      - "Sources/**"
      - "Tests/**"
      - "Vendor/**"
      - "scripts/**"
  workflow_dispatch:

# CI는 저장소를 읽기만 하며 서명·공증용 Secrets를 사용하지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and verify app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODEXSWITCH_ARCH: arm64
      ALLOW_ADHOC: "1"

    steps:
      # 공식 Action도 변경 불가능한 전체 커밋 SHA로 고정한다.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 빌드 환경이 의도한 Apple Silicon·Xcode 버전인지 먼저 확인한다.
      - name: Confirm build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version

      # 기존 릴리스 스크립트로 테스트, helper 무결성, 앱 번들을 한 번에 검증한다.
      - name: Test, build, and verify
        shell: bash
        run: ./scripts/package-release.sh

      # PR에는 산출물을 남기지 않고 main·수동 실행에서만 단기 테스트 ZIP을 제공한다.
      - name: Upload development build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexSwitch-development-arm64-${{ github.sha }}
          path: |
            dist/CodexSwitch-*-macos-arm64-adhoc.zip
            dist/CodexSwitch-*-macos-arm64-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
